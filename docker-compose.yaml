version: '3.8'

services:
  ros2_dev:
    build:
      context: .
      args:
        #   # Docker Compose will now read the values for these variables
        #   # from the .env file or use the defaults provided.
        - UID=${UID:-1000}
        - GID=${GID:-1000}
      #   - VIDEO_GID=${VIDEO_GID}
    image: ros2-head-control
    container_name: tele_head_container
    # Start the whole head on boot and after a crash. To work in the container by
    # hand: docker exec -it tele_head_container bash. To stop it: docker stop tele_head_container
    restart: unless-stopped
    command: /home/docker_user/start_head.sh
    environment:
      - ROS_DISTRO=humble
      - DISPLAY=${DISPLAY:-:0}
      # The desktop writes a new .Xauthority at every login. Read it through the
      # mounted home folder: a mount of the file itself would keep showing the old one.
      - XAUTHORITY=/host_home/.Xauthority
      - XDG_RUNTIME_DIR=/tmp/runtime-docker
    volumes:
      - ./ros2_ws_head:/home/docker_user/ros2_ws_head
      - /tmp/.X11-unix:/tmp/.X11-unix
      - ~/:/host_home:ro
      - ./start_head.sh:/home/docker_user/start_head.sh:ro
    devices:
      - /dev/video0:/dev/video4
      - /dev/ttyACM0:/dev/ttyACM0
      - /dev/ttyUSB0:/dev/ttyUSB0
      - /dev/dri:/dev/dri            # For GPU hardware acceleration
      - /dev/hailo0:/dev/hailo0      # For Hailo AI HAT+ hardware acceleration
    network_mode: "host"
    privileged: true
    stdin_open: true
    tty: true
