# Person Intent Classifier Configuration File
# This YAML file contains all configurable parameters for the Person Intent Classifier node.
# Users can modify these values to tune the behavior for their specific use case.

/person_intent_classifier:
  ros__parameters:

    # ==========================================
    # TOPIC CONFIGURATION
    # ==========================================
    # ROS2 topic names for input data
    bbox_topic: '/hospibot/pose_bbox'            # Bounding box input topic from camera
    radar_topic: '/person_detect/filtered_points'# Radar point cloud input topic
    odom_topic: '/odom'                          # Odometry topic (used to subtract robot movement)
    use_odom: false

    # ==========================================
    # CAMERA PARAMETERS
    # ==========================================
    # Image dimensions and processing settings
    image_width: 256                             # Camera image width in pixels
    image_height: 192                            # Camera image height in pixels
    
    bbox_timeout: 2.0                            # Timeout in seconds before showing "NO_PERSON_DETECTED"
                                                 # How long to wait without bounding box before clearing intent

    # ==========================================
    # INTENT CLASSIFICATION THRESHOLDS
    # ==========================================
    # Primary (Radar) and Fallback (Camera) boundary settings
    
    # Radar-based Interaction Distances
    interact_distance_thresh: 1.8                # Distance in meters to detect WANT_TO_INTERACT intent
    close_distance_thresh: 3.2                   # Distance in meters to detect CLOSE_PROXIMITY intent
    
    # Camera-based Fallback Ratios (Used if radar is missing)
    interact_threshold_ratio: 0.30               # If box area exceeds 30% of image, classify WANT_TO_INTERACT
    close_threshold_ratio: 0.20                  # If box area exceeds 20% of image, classify CLOSE_PROXIMITY

    # ==========================================
    # RADAR PROCESSING & PHYSICS PARAMETERS
    # ==========================================
    # Settings for parsing and filtering the PointCloud2 data
    
    radar_range_axis: 'z'                        # Axis representing depth from radar ('x', 'y', 'z', or 'norm')
    radar_max_range: 10.0                        # Maximum valid distance (m) to consider a radar point
    radar_forward_offset: 0.05                   # Distance (m) from robot center to radar sensor (for turning math)
    
    radar_timeout: 0.5                           # Maximum age of radar data (sec) before falling back to camera
    min_time_delta: 0.05                         # Minimum time difference (sec) between radar hits to calculate velocity
    
    # Motion Thresholds
    low_speed_threshold: 0.02                    # Minimum speed (m/s) to consider movement (below = STATIONARY)
    moving_away_size_threshold: 0.8              # Bounding box pixel shrink rate to flag MOVING_AWAY

    # ==========================================
    # DATA SMOOTHING & ANTI-FLICKER LOGIC
    # ==========================================
    # Historical data processing to reduce noise and bounce
    
    smoothing_window: 10                         # Number of previous camera bounding boxes to average
    radar_smoothing_window: 5                    # Number of previous radar measurements to average
    
    persistence_threshold: 10                    # Number of consecutive identical states required before 
                                                 # officially changing the published intent (debouncing)

    
    hysteresis_distance_buffer: 0.2              # Sticky buffer (m) added to boundaries so standing exactly
                                                 # on the line doesn't cause the state to flicker back and forth
